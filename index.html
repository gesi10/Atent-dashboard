
<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paneli ATENT - Coinat Live</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #222;
        }
        .coin {
            background: white;
            margin: 10px auto;
            padding: 15px 20px;
            width: 90%;
            max-width: 400px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            font-size: 18px;
        }
        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Paneli ATENT - Coinat Live</h1>
    <div id="data">
        <p>Duke u ngarkuar...</p>
    </div>

    <script>
        const coins = ['BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT','XRPUSDT','ADAUSDT','AVAXUSDT','LINKUSDT','DOGEUSDT','TONUSDT','DOTUSDT','INJUSDT','NEARUSDT','ATOMUSDT','MATICUSDT'];
        const names = {
            BTCUSDT: "Bitcoin (BTC)",
            ETHUSDT: "Ethereum (ETH)",
            BNBUSDT: "BNB",
            SOLUSDT: "Solana (SOL)",
            XRPUSDT: "XRP",
            ADAUSDT: "Cardano (ADA)",
            AVAXUSDT: "Avalanche (AVAX)",
            LINKUSDT: "Chainlink (LINK)",
            DOGEUSDT: "Dogecoin (DOGE)",
            TONUSDT: "Toncoin (TON)",
            DOTUSDT: "Polkadot (DOT)",
            INJUSDT: "Injective (INJ)",
            NEARUSDT: "NEAR Protocol",
            ATOMUSDT: "Cosmos (ATOM)",
            MATICUSDT: "Polygon (MATIC)"
        };

        async function fetchPrices() {
            const container = document.getElementById('data');
            try {
                const response = await fetch('https://api.binance.com/api/v3/ticker/price');
                const data = await response.json();
                container.innerHTML = '';
                coins.forEach(coin => {
                    const item = data.find(d => d.symbol === coin);
                    if (item) {
                        const div = document.createElement('div');
                        div.className = 'coin';
                        div.textContent = `${names[coin]}: $${parseFloat(item.price).toFixed(2)}`;
                        container.appendChild(div);
                    }
                });
            } catch (error) {
                container.innerHTML = '<p class="error">Gabim gjatë marrjes së të dhënave.</p>';
            }
        }

        fetchPrices();
        setInterval(fetchPrices, 10000); // çdo 10 sekonda
    </script>
</body>
</html>
