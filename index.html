
<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paneli ATENT - Coinat Live</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            text-align: center;
            padding: 40px 10px;
        }
        h1 {
            color: #222;
        }
        .coin {
            background: white;
            margin: 10px auto;
            padding: 12px;
            border-radius: 12px;
            width: 80%;
            max-width: 400px;
            font-size: 18px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        #error {
            color: red;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Paneli ATENT - Coinat Live</h1>
    <div id="coins"></div>
    <div id="error"></div>

    <script>
        const coins = ["bitcoin", "ethereum", "binancecoin", "solana", "ripple", "cardano", "avalanche-2", "chainlink", "dogecoin", "polkadot"];
        const coinNames = {
            "bitcoin": "Bitcoin (BTC)",
            "ethereum": "Ethereum (ETH)",
            "binancecoin": "BNB",
            "solana": "Solana (SOL)",
            "ripple": "XRP",
            "cardano": "Cardano (ADA)",
            "avalanche-2": "Avalanche (AVAX)",
            "chainlink": "Chainlink (LINK)",
            "dogecoin": "Dogecoin (DOGE)",
            "polkadot": "Polkadot (DOT)"
        };

        async function fetchPrices() {
            try {
                const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${coins.join(",")}&vs_currencies=usd`);
                const data = await res.json();
                const container = document.getElementById("coins");
                const errorBox = document.getElementById("error");
                container.innerHTML = "";
                errorBox.innerText = "";

                coins.forEach(id => {
                    const price = data[id]?.usd;
                    if (price !== undefined) {
                        const div = document.createElement("div");
                        div.className = "coin";
                        div.textContent = `${coinNames[id]}: $${price}`;
                        container.appendChild(div);
                    }
                });
            } catch (err) {
                document.getElementById("error").innerText = "Gabim gjatë marrjes së të dhënave.";
            }
        }

        fetchPrices();
        setInterval(fetchPrices, 5000);
    </script>
</body>
</html>
